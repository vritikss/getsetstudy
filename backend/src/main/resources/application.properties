# Local defaults. On a host (Render) these are overridden by environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Root1234}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
